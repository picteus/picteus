name: Back-end CI
run-name: Manages the back-end dependencies installation, compilation and tests

on:
  push:
    branches: [ 'master' ]
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches: [ 'master' ]
  workflow_dispatch:
    inputs:
      os:
        description: 'OS to run against?'
        type: choice
        required: true
        options:
          - '["windows-latest"]'
          - '["windows-11-arm"]'
          - '["macos-26"]'
          - '["macos-15-intel"]'
          - '["ubuntu-latest"]'
        default: '["macos-26"]'

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: ${{ (github.event_name == 'push' && fromJson('["macos-26"]')) || fromJson(inputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - id: checkout
        name: Checks out the project
        uses: actions/checkout@v7
      - id: node-setup-22
        name: Sets up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - id: java-setup
        name: Sets up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - id: node-setup
        name: Sets up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - id: install
        name: Installs the root dependencies
        run: npm install
      - id: prerequisites
        if: ${{ env.skip != 'true' }}
        name: Installs the prerequisites and back-end dependencies
        run: npm run prerequisites:back-end:ci
      - id: compile
        name: Generates some code and compiles
        run: npm run build:back-end:ci
      - id: tests
        name: Runs the tests
        run: npm test:back-end:ci
